<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Drug List รายชื่อยา</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="home.css">
</head>
<body>

  <div id="navbar"></div>
  <script src="../../components/nav.js"></script>

  <div class="container">

    <!-- ฟอร์มค้นหา -->
    <div class="card">
      <div class="card-title">ค้นหาข้อมูล</div>

      <div class="form-group">
        <label class="form-label" for="searchAmount">จำนวน :</label>
        <input id="searchAmount" type="text" class="form-control" placeholder="จำนวนที่ค้นหา" />
      </div>

      <div class="form-group">
        <label class="form-label" for="searchCompanyId">Company ID :</label>
        <input id="searchCompanyId" type="text" class="form-control" placeholder="ค้นหาตาม ID" />
      </div>

      <div class="form-group">
        <label class="form-label" for="searchCompanyName">Company Name :</label>
        <input id="searchCompanyName" type="text" class="form-control" placeholder="ค้นหาตามชื่อบริษัท" />
      </div>

      <div class="form-group">
        <label class="form-label" for="searchRegNo">Reg No. :</label>
        <input id="searchRegNo" type="text" class="form-control" placeholder="ค้นหาตาม Registration No." />
      </div>

      <div class="form-group">
        <label class="form-label" for="searchTradeNameTH">Trade Name(TH) :</label>
        <input id="searchTradeNameTH" type="text" class="form-control" placeholder="ค้นหาตาม Trade Name(TH)" />
      </div>

      <div class="form-group">
        <label class="form-label" for="searchTradeNameEN">Trade Name(EN) :</label>
        <input id="searchTradeNameEN" type="text" class="form-control" placeholder="ค้นหาตาม Trade Name(EN)" />
      </div>

      <div class="btn-row">
        <button class="btn btn-search" id="btnSearch">Search</button>
        <button class="btn btn-clear" id="btnClear">Clear</button>
      </div>
    </div>

    <!-- ตารางผลลัพธ์ -->
    <div class="card table-card">

      <div class="table-toolbar">
        <div class="table-entries">
          Show
          <select class="entries-select" id="entriesSelect">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50">50</option>
          </select>
          entries
        </div>
        <div class="table-search">
          Search: <input type="text" class="table-search-input" id="tableSearchInput" />
        </div>
      </div>

      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID <span class="sort-icon">⇅</span></th>
              <th>Company Name <span class="sort-icon">⇅</span></th>
              <th>Com.ID <span class="sort-icon">⇅</span></th>
              <th>Registration NO <span class="sort-icon">⇅</span></th>
              <th>Trade Name(TH) <span class="sort-icon">⇅</span></th>
              <th>Trade Name(EN) <span class="sort-icon">⇅</span></th>
              <th>Drug Form <span class="sort-icon">⇅</span></th>
              <th>Status <span class="sort-icon">⇅</span></th>
              <th>
                <a href="../edit/registration.html">Edit</a>
              </th>
              <th>Del</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="10" class="no-data">ไม่พบข้อมูล</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="table-footer">
        <span class="table-info" id="tableInfo">Showing 0 to 0 of 0 entries</span>
        <div class="pagination" id="pagination">
          <button class="page-btn" id="prevBtn">Previous</button>
          <button class="page-btn" id="nextBtn">Next</button>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
